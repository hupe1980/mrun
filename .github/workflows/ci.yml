name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The window's page (018): its tests, and that the committed, embedded `ui/dist` is what the
  # sources build (Rust jobs embed `dist` as committed and need no Node).
  ui:
    name: UI (tests, built page matches sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crates/mrun/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/mrun/ui/package-lock.json
      - run: npm ci
      - run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
      - run: npm test
      - run: npm run build
      - name: The committed page is the built one
        run: git diff --exit-code -- dist
      # 019 FR-018: every place, light and dark, on fixed data, for review (Chrome is on the image).
      - name: Screenshots
        run: npm run shots
      - uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: crates/mrun/ui/shots/

  linux:
    name: Linux (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      # The engine-agnostic parts (the Linux agent): `--no-default-features` leaves out the engine.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --no-default-features -- --skip mcp:: --skip each_tool_call --skip tools_list_without_secrets --skip the_workspace_tools --skip a_remote_server --skip a_server_that_cannot_start
      # The formula renders one archive with its checksum (Ruby is on the image).
      - name: Release tooling tests
        run: scripts/release/test.sh

  package:
    name: Package (cargo package dry runs)
    # Every crate must stay publishable (D026): no files outside the crate directories, complete
    # `include` lists, path dependencies with versions. Verification builds without the engine.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Package the workspace (mrun-engine, mrun-runpod, mrun)
        run: cargo package --locked --workspace --no-default-features

  macos:
    name: macOS (clippy, build)
    # The engine on nuvec (022). Hosted runners have no reliable Metal GPU: build and lint only;
    # the GPU suites run on Apple hardware (CONTRIBUTING.md).
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # A build without the Metal toolchain would compile the kernels at start instead.
      NUVEC_REQUIRE_METALLIB: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --workspace --all-targets

  macos-release:
    name: macOS (release build)
    # The configuration the release workflow ships (022 R4): one arm64 archive for macOS 15 and
    # later, built on an SDK >= 26.2 so nuvec's NAX kernels are compiled in (nuvec runs them only
    # where the OS and GPU allow). NAX_RUNNER (a repository variable) replaces `macos-26` when
    # GitHub's image has no SDK >= 26.2.
    runs-on: ${{ vars.NAX_RUNNER || 'macos-26' }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      NUVEC_REQUIRE_METALLIB: "1"
      NUVEC_REQUIRE_NAX: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -n "${xcode}" ]]; then sudo xcode-select -s "${xcode}/Contents/Developer"; fi
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin
      - name: Release build
        run: cargo build --locked --release --target aarch64-apple-darwin -p mrun
      - name: Smoke-test the binary on its own
        run: |
          alone="$(mktemp -d)"
          cp target/aarch64-apple-darwin/release/mrun "${alone}/mrun"
          "${alone}/mrun" --version | tee version.txt
          grep -q ' nuvec .*, kernels precompiled, nax ' version.txt
          home="$(mktemp -d)"
          HOME="${home}" "${alone}/mrun" doctor | tee doctor.txt || true
          grep -q '^ok    gpu-kernels' doctor.txt
      - name: Disk usage
        if: always()
        run: df -h
