name: release

# One macOS archive per release (022 R4): mrun-X.Y.Z-macos-arm64.tar.gz, deployment target 15.0,
# built on an SDK >= 26.2 so nuvec's NAX kernels are compiled in (nuvec runs them only where the
# OS and GPU allow, and keeps them off until measured on an M5). The tap formula has one download
# (packaging/homebrew/mrun.rb.in).
#
# That needs a hosted image with Xcode 26.2 or later (`macos-26`). If GitHub's image ships an
# older SDK, nuvec's build fails (NUVEC_REQUIRE_NAX); run it on a self-hosted Apple Silicon runner
# with Xcode >= 26.2 instead by setting the repository variable NAX_RUNNER (for example
# `self-hosted`), which replaces `macos-26` below.
#
# After the builds, the release job attests their build provenance and publishes the GitHub
# Release with the CHANGELOG notes; for a release, not a pre-release (`-rc.N`), it then publishes
# the crates and updates the Homebrew tap, and installs the result with Homebrew on clean runners.
#
# Owner setup (once, before the first real tag):
# - the tap hupe1980/homebrew-tap (the formula goes to Formula/mrun.rb beside the other
#   formulas), and a GitHub App installed on that repository only, with repository permission
#   contents: read and write (speccoder's App serves; give mrun its own private key);
# - GitHub environment `release`, deployment rule: tags `v*`, holding HOMEBREW_APP_ID and
#   HOMEBREW_APP_PRIVATE_KEY (the App's ID and a private key) and CARGO_REGISTRY_TOKEN: a
#   crates.io API token with the scopes publish-new and publish-update, limited to the crates
#   `mrun` and `mrun-*`, with an expiry.
#
# Trusted publishing can only be set up for crates that already exist; after the first release it
# can replace the token.
#
# Third-party actions are pinned by commit: this workflow holds write tokens.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # nuvec (016 FR-009): a missing precompiled metallib, or missing NAX kernels, fail the build
  # instead of shipping shader sources compiled at start.
  NUVEC_REQUIRE_METALLIB: "1"
  NUVEC_REQUIRE_NAX: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false

      - name: Check tag, version and changelog agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          base="${tag%%-rc.*}"
          if [[ "${base}" != "${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version ${version}" >&2; exit 1
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2; exit 1
          fi
          echo "version=${tag}" >> "${GITHUB_OUTPUT}"
          if [[ "${tag}" == *-rc.* ]]; then echo "prerelease=true" >> "${GITHUB_OUTPUT}"; else echo "prerelease=false" >> "${GITHUB_OUTPUT}"; fi

      # Releases ship only commits CI passed on: the tag must point at a commit whose CI run
      # (push to main) succeeded. Waits while that run is still in progress.
      - name: Require a green CI run on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 90); do
            runs="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${GITHUB_SHA}" \
              --json status,conclusion --jq '[.[] | "\(.status):\(.conclusion)"] | join(" ")')"
            if [[ " ${runs} " == *" completed:success "* ]]; then
              echo "CI is green on ${GITHUB_SHA}"; exit 0
            fi
            unfinished="$(tr ' ' '\n' <<< "${runs}" | grep -v '^completed:' || true)"
            if [[ -n "${runs}" && -z "${unfinished}" ]]; then
              echo "CI did not pass on ${GITHUB_SHA}: ${runs}" >&2; exit 1
            fi
            echo "waiting for CI on ${GITHUB_SHA} (${runs:-no run yet})"
            sleep 60
          done
          echo "no successful CI run on ${GITHUB_SHA} after 90 minutes; push the commit to main first" >&2
          exit 1

  build:
    needs: check
    runs-on: ${{ vars.NAX_RUNNER || 'macos-26' }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Select the newest Xcode
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -n 1)"
          if [[ -n "${xcode}" ]]; then sudo xcode-select -s "${xcode}/Contents/Developer"; fi
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version) ($(xcode-select -p)), deployment target ${MACOSX_DEPLOYMENT_TARGET}"

      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin

      # `--version` shows the 7-character commit, as a build from a checkout does.
      - name: Build
        run: MRUN_BUILD_COMMIT="${GITHUB_SHA::7}" cargo build --release --locked --target aarch64-apple-darwin -p mrun

      # Sign, then smoke-test the binary on its own: the engine's kernels are embedded.
      - name: Sign and smoke-test
        run: |
          scripts/release/sign.sh target/aarch64-apple-darwin/release/mrun
          alone="$(mktemp -d)"
          cp target/aarch64-apple-darwin/release/mrun "${alone}/mrun"
          "${alone}/mrun" --version | tee version.txt
          grep -q ' nuvec .*, kernels precompiled, nax ' version.txt
          home="$(mktemp -d)"
          HOME="${home}" "${alone}/mrun" doctor | tee doctor.txt || true
          grep -q '^ok    gpu-kernels' doctor.txt

      - name: Package
        run: |
          version="${{ needs.check.outputs.version }}"
          tarball="$(scripts/release/package.sh "${version}" target/aarch64-apple-darwin/release staging)"
          name="$(basename "${tarball}")"
          mkdir -p dist
          mv "${tarball}" "dist/${name}"
          (cd dist && shasum -a 256 "${name}" > "${name}.sha256")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mrun-macos
          path: dist/*
          if-no-files-found: error

  # The remote-GPU agent (013, D064): a Linux build of mrun without the engine that `mrun cloud up`
  # has pods fetch and check by sha256. glibc 2.28 so it runs on every vLLM image.
  agent:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Install toolchain, zig and cargo-zigbuild
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-gnu
          pip install ziglang
          cargo install cargo-zigbuild --locked
      - name: Build the agent
        run: |
          MRUN_BUILD_COMMIT="${GITHUB_SHA::7}" cargo zigbuild --release --locked \
            --target x86_64-unknown-linux-gnu.2.28 --no-default-features -p mrun
      - name: Smoke-test and checksum
        run: |
          version="${{ needs.check.outputs.version }}"
          name="mrun-${version}-x86_64-unknown-linux-gnu"
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/mrun "dist/${name}"
          "dist/${name}" agent --help > /dev/null
          (cd dist && sha256sum "${name}" > "${name}.sha256" && cat "${name}.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mrun-agent
          path: dist/*
          if-no-files-found: error

  release:
    needs: [check, build, agent]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mrun-*
          path: dist
          merge-multiple: true
      # SHA256SUMS lists the tarballs (the formula reads it); the agent keeps its own .sha256,
      # which `mrun cloud up` fetches beside it.
      - run: |
          cd dist
          cat ./*-arm64.tar.gz.sha256 > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          shasum -a 256 -c ./*-x86_64-unknown-linux-gnu.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/mrun-*-x86_64-unknown-linux-gnu
      - name: Publish the GitHub Release
        run: |
          tag="v${VERSION}"
          if state="$(gh release view "${tag}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [ "${state}" = true ] || { echo "release ${tag} is already published; assets are never overwritten"; exit 1; }
          else
            flags=()
            [ "${PRERELEASE}" = true ] && flags+=(--prerelease)
            awk -v v="${VERSION%%-rc.*}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
            gh release create "${tag}" --draft --verify-tag --title "mrun ${VERSION}" --notes-file notes.md "${flags[@]}"
          fi
          # An upload GitHub took but did not answer is retried by gh and refused as "already
          # exists"; a second pass with --clobber replaces it.
          for attempt in 1 2 3; do
            gh release upload "${tag}" dist/*.tar.gz dist/SHA256SUMS \
              dist/mrun-*-x86_64-unknown-linux-gnu dist/mrun-*-x86_64-unknown-linux-gnu.sha256 \
              --clobber && break
            [ "${attempt}" = 3 ] && exit 1
            sleep 10
          done
          gh release edit "${tag}" --draft=false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums
          path: dist/SHA256SUMS

  # Final releases only, in dependency order; a crate version already on crates.io is skipped, so a
  # re-run after a partial publish continues where it stopped. On macOS: verifying mrun builds
  # the engine, whose kernels need the Metal toolchain.
  crates:
    needs: [check, release]
    if: needs.check.outputs.prerelease == 'false'
    runs-on: macos-15
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: The token is there
        run: |
          [ -n "${CARGO_REGISTRY_TOKEN}" ] || { echo "CARGO_REGISTRY_TOKEN is not set in the environment release"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Publish
        run: |
          export MRUN_BUILD_COMMIT="${GITHUB_SHA::7}"
          published() {
            curl -fsS -o /dev/null -A "mrun-release (github.com/${GITHUB_REPOSITORY})" \
              "https://crates.io/api/v1/crates/$1/${VERSION}"
          }
          for crate in mrun-engine mrun-runpod mrun; do
            if published "${crate}"; then echo "${crate} ${VERSION} already published"; else
              cargo publish --locked -p "${crate}"
            fi
          done

  tap:
    needs: [check, release]
    if: needs.check.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
          path: dist
      # A short-lived installation token that can write to the tap only.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: hupe1980
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hupe1980/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: tap
          persist-credentials: true
      - name: Update the formula
        run: |
          mkdir -p tap/Formula
          scripts/release/formula.sh "${VERSION}" dist/SHA256SUMS > tap/Formula/mrun.rb
          cd tap
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "mrun release"
            git config user.email "mrun-release@users.noreply.github.com"
            git add Formula/mrun.rb
            git commit -m "mrun ${VERSION}"
            git push
          fi

  # Installs the release from the tap on clean runners (final releases, after the tap update):
  # the one archive on macOS 15 and 26.
  smoke:
    needs: [check, tap]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Homebrew
        run: |
          brew install hupe1980/tap/mrun
          brew test mrun
          mrun --version | grep -q "^mrun ${VERSION} "
