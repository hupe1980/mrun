[package]
name = "mrun-candle-budget"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
description = "Feasibility experiment: enforceable allocation bounds for Candle (not part of mrun)"
license = "MIT OR Apache-2.0"
publish = false

# Standalone workspace: the experiment must never join or change the root package.
[workspace]

[features]
default = []
metal = ["candle-core/metal"]
# Requires Candle with patches/0001-metal-allocation-gate.patch applied (see results.md).
metal-gate = ["metal", "dep:candle-metal-kernels"]

[dependencies]
candle-core = { git = "https://github.com/huggingface/candle.git", rev = "c68b24997319b8d76e5a4e775dab197c7f26322a", default-features = false }
candle-metal-kernels = { git = "https://github.com/huggingface/candle.git", rev = "c68b24997319b8d76e5a4e775dab197c7f26322a", optional = true }

# Host-library probes (T118) at the research C-05 pins. `fancy-regex` replaces Oniguruma so
# every tokenizer allocation goes through the Rust allocator the probes observe.
[dev-dependencies]
minijinja = { version = "=2.24.0", default-features = false, features = ["builtins", "serde", "macros", "multi_template", "adjacent_loop_items", "fuel"] }
tokenizers = { version = "=0.23.1", default-features = false, features = ["fancy-regex"] }
llguidance = { version = "=1.9.1", default-features = false }
toktrie = "=1.9.1"
serde_json = "1"
