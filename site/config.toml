base_url = "https://hupe1980.github.io/mrun"
title = "mrun — local inference server for coding agents on Apple Silicon"
description = "mrun runs coding models locally on your Mac and serves Claude Code, Codex and OpenCode with exact prefix caching, predictable memory and instant interruption."
default_language = "en"
compile_sass = true
minify_html = true
build_search_index = true
generate_sitemap = true
generate_robots_txt = true
generate_feeds = false
author = "mrun contributors"

[markdown]
insert_anchor_links = "right"
smart_punctuation = true
external_links_target_blank = true
external_links_no_follow = false
external_links_no_referrer = true
bottom_footnotes = true

[markdown.highlighting]
theme = "github-dark"

[search]
include_title = true
include_description = true
include_content = true
index_format = "elasticlunr_json"

[extra]
repo = "https://github.com/hupe1980/mrun"
tagline = "Your agent's context, computed once."
status = "mrun is in active development. Commands on this site describe the first release; follow the repository for progress."
keywords = "local LLM, Apple Silicon, MLX, coding agent, Claude Code, Codex, OpenCode, prefix cache, KV cache, Rust, OpenAI API, Anthropic API"
