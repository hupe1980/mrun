[workspace]
resolver = "3"
members = ["crates/mrun-engine", "crates/mrun"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/mrun"
authors = ["hupe1980"]

[workspace.dependencies]
mrun-engine = { path = "crates/mrun-engine" }
crossbeam-channel = "0.5.17"
minijinja = { version = "3.0.0", features = ["serde", "json", "loop_controls", "preserve_order"] }
minijinja-contrib = { version = "3.0.0", features = ["pycompat"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27"
thiserror = "2.0.21"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
toml = "1.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
