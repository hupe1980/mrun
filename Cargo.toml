[workspace]
resolver = "3"
members = ["crates/mrun-engine", "crates/mrun-runpod", "crates/mrun"]

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/mrun"
authors = ["hupe1980"]

[workspace.dependencies]
# Path plus version: local builds use the path, published crates the version.
mrun-engine = { path = "crates/mrun-engine", version = "=0.4.2", default-features = false }
mrun-runpod = { path = "crates/mrun-runpod", version = "=0.4.2" }
flume = { version = "0.12.0", default-features = false, features = ["async"] }
minijinja = { version = "3.0.0", features = ["serde", "json", "loop_controls", "preserve_order"] }
minijinja-contrib = { version = "3.0.0", features = ["pycompat"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27"
thiserror = "2.0.21"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
toml = "1.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies optimized, mrun's crates debuggable: nuvec's CPU kernels are Rust, and unoptimized
# they make the CPU test suites tens of times slower. Results are the same at any opt-level.
[profile.dev.package."*"]
opt-level = 3
