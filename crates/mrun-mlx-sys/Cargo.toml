[package]
name = "mrun-mlx-sys"
description = "Raw FFI bindings to mlx-c v0.7.0 over a statically linked, pinned MLX v0.32.4 (built from source)"
readme = "README.md"
# Not a member of the root workspace (see the root Cargo.toml `exclude`), so the fast
# `--no-default-features` checks never build MLX; `mrun`'s default `mlx` feature does (through
# `mrun-engine`), once per configuration into the user cache. Keep these fields in sync with the
# root `[workspace.package]` by hand.
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/mrun"
authors = ["hupe1980"]
keywords = ["mlx", "apple-silicon", "ffi", "metal", "sys"]
categories = ["external-ffi-bindings", "science"]
links = "mlxc"
build = "build.rs"
include = ["build.rs", "src/**", "patches/**", "tests/**", "regen.sh", "README.md"]

[lib]
# Dependants write `mlx_sys::…`.
name = "mlx_sys"

[build-dependencies]
cmake = "0.1.58"
sha2 = "0.11.1"
# Compresses mlx.metallib (~215 MB -> ~15 MB) so `mrun-engine` can embed it (D034).
zstd = { version = "0.14.2", default-features = false, features = ["zstdmt"] }

[lints.rust]
missing_debug_implementations = "warn"

[package.metadata.docs.rs]
# The bindings are checked in; with `DOCS_RS` set the build script fetches and builds nothing.
targets = ["aarch64-apple-darwin"]

# Standalone workspace: test with `cargo test --manifest-path crates/mrun-mlx-sys/Cargo.toml`.
[workspace]
