[package]
name = "mrun"
description = "Local inference server for coding agents on Apple Silicon"
readme = "../../README.md"
keywords = ["llm", "inference", "apple-silicon", "mlx", "agents"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# `ScriptedEngine` and test fixtures, for integration tests and the test suites of later features.
test-support = []
# The MLX engine (macOS; builds MLX from source).
mlx = ["mrun-engine/mlx"]

[dependencies]
axum = "0.8"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
flume.workspace = true
minijinja.workspace = true
minijinja-contrib.workspace = true
mrun-engine.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "signal", "macros", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "system-proxy"] }
sha1 = "0.11"
tempfile.workspace = true
toml.workspace = true
llguidance = { version = "1.9.1", default-features = false, features = ["lark"] }
toktrie = "1.9.1"
clap_complete = "4.6"

[dev-dependencies]
# Integration tests are built against the library with `test-support`.
mrun = { path = ".", features = ["test-support"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
