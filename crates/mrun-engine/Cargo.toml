[package]
name = "mrun-engine"
description = "Engine contract, model identity and (with the `engine` feature) the nuvec engine for mrun"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["llm", "inference", "metal", "apple-silicon"]
categories = ["science"]

[features]
default = []
# The engine on nuvec (a pure-Rust MLX port), pinned exactly. `mrun` turns it on; without it the
# crate is the engine contract and model identity (the Linux agent).
engine = ["dep:nuvec", "dep:nuvec-kernels"]
# Tiny random-weight checkpoints for tests (`testing`), shared with `mrun`'s suites.
test-support = []

[dependencies]
nuvec = { version = "=0.7.0", optional = true }
# nuvec's kernel mode (`MODE`: precompiled or runtime), not re-exported by `nuvec`.
nuvec-kernels = { version = "=0.7.0", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true

[lints]
workspace = true

[[example]]
name = "generate"
required-features = ["engine"]

[[example]]
name = "bench_engine"
required-features = ["engine"]

[[example]]
name = "bench_qmm_rows"
required-features = ["engine"]
